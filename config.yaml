        - "consultor"
        - "abogado"
        - "asesor"
        - "estudio contable"
        - "consultoría"
      bonus_score: 5
      pain_points:
        - "reportes a clientes"
        - "facturación"
        - "gestión documental"

    - name: "Salud y Belleza"
