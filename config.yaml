# Lead Extractor Configuration
# Generated for: Automatización General
# Target: Micro-empresas Chile (1-10 empleados)

business:
  name: "Mi Solución"
  product_type: "automatización general"
  description: "Automatización de procesos para micro-empresas: agendamiento, inventario, facturación y gestión"

search:
  industries:
    - name: "Barbería y Peluquería"
      keywords:
        - "barbería"
        - "barber"
        - "barbershop"
        - "peluquería"
        - "salón de belleza"
        - "corte de cabello"
        - "barber shop"
        - "barba"
        - "barberia"
      bonus_score: 5
      pain_points:
        - "agendamiento de turnos"
        - "gestión de inventario"
        - "control de caja"

    - name: "Cafetería y Restaurante"
      keywords:
        - "cafetería"
        - "café"
        - "coffee shop"
        - "restaurante"
        - "panadería"
        - "pastelería"
      bonus_score: 5
      pain_points:
        - "turnos de personal"
        - "inventario de insumos"
        - "reportes de ventas"

    - name: "Servicios Profesionales"
      keywords:
