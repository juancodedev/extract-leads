scoring:
  base_score: 50
  max_score: 100
  dup_threshold: 85
  weights:
    website: 15
    active_social: 20
    whatsapp: 10
    pain_points: 15
    multiple_channels: 10
    owner_info: 5
    premium_location: 10
  thresholds:
    slow_ms: 3000
    warn_ms: 1500
  goal_bonuses:
    web:
      no_site_bonus: 40
      has_site_penalty: -10
    seo:
      no_social_bonus: 20
      poor_tech_bonus: 30
      no_site_penalty: -20
    ads:
      has_site_bonus: 20
      low_rating_bonus: 15
      low_rating_threshold: 4.2
    general:
      high_rating_threshold: 4.5
    automatizacion:
      no_site_bonus: 40
      no_booking_bonus: 30
      no_whatsapp_bonus: 20
      has_site_no_booking_bonus: 15
    reservas:
      no_booking_bonus: 40
      has_site_no_booking_bonus: 20
      service_industry_bonus: 15
      has_booking_penalty: -30
    menus:
      food_industry_bonus: 35
      non_food_penalty: -10
      no_prices_bonus: 30
      no_gallery_bonus: 20
      mature_site_penalty: -20
    inventarios:
      retail_industry_bonus: 30
      has_site_bonus: 20
      basic_cms_bonus: 15
      has_booking_penalty: -10
    pos:
      phone_no_whatsapp_bonus: 30
      no_site_bonus: 25
      site_no_form_bonus: 20
      digital_mature_penalty: -15
  tiers:
    hot: [80, 100]
    warm: [60, 79]
    cool: [40, 59]
    cold: [0, 39]

# ── Extraction tuning ──
extraction:
  max_pages: 3
  page_token_delay: 2
  request_timeout: 15
  max_retries: 3
  retry_backoff: 1.5

# ── Enrichment tuning ──
enrichment:
  hunter_timeout: 10
  website_scan_timeout: 10
  max_retries: 3
  retry_backoff: 1.5

output:
  format: csv
  fields:
    - business_name
    - industry
    - contact_person
    - phone
    - email
    - address
    - city
    - website
    - facebook_url
    - instagram_handle
    - google_rating
    - review_count
    - lead_score
    - lead_tier
    - source

